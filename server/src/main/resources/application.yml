spring:
  application:
    name: pc-file-transfer-server

  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB
      file-size-threshold: 2MB

server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

  tomcat:
    max-swallow-size: 5GB
    connection-timeout: 30s
    max-http-form-post-size: 5GB

file-transfer:
  storage:
    location: ${user.home}/PCFileTransfer/shared

  max-upload-bytes: 5368709120
  max-list-items: 10000

  rate-limit:
    requests-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.pcfiletransfer.server: INFO