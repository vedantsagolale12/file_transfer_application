name: file_transfer_app
description: PC File Transfer - Transfer files between mobile and PC over Wi-Fi
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  dio: ^5.7.0
  get_it: ^8.0.0
  file_picker: ^13.1.0
  path_provider: ^2.1.4
  multicast_dns: ^0.3.2+1
  network_info_plus: ^8.2.2
  open_filex: ^4.6.0
  shared_preferences: ^2.5.6
  go_router: ^14.6.2
  convert: ^3.1.2
  crypto: ^3.0.5
  mime: ^1.0.6
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
